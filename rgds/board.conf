# board.conf - which board this branch of the tree builds. Read by
# rgds/build-boot-images.sh and rgds/build-wifi.sh via rgds/toolchain.sh.
#
# Anbernic RG DS Plus: Rockchip RK3568, dual DSI panels, microSD boot (no eMMC).
BOARD="Anbernic RG DS Plus"

# The compiler this board's kernel was built and verified with. Every module
# loaded into the kernel (8821cs.ko in vendor_dlkm) must come from the same
# compiler and tree. The RG DS Plus is built with the aarch64-linux-gnu- gcc.
TOOLCHAIN="gcc"

# "dtb-basename:variant" pairs, one boot image each. The Plus has a single
# device tree carrying its per-bin CPU points, so one image: out/boot.img.
DTBS="rk3568-anbernic-rg-ds-plus:"
