# board.conf - which board this branch of the tree builds. Read by
# rgds/build-boot-images.sh and rgds/build-wifi.sh via rgds/toolchain.sh.
#
# Anbernic RG DS: Rockchip RK3566, dual 640x480 DSI panels, eMMC boot.
BOARD="Anbernic RG DS"

# The compiler this board's kernel was built and verified with. Every module
# loaded into the kernel (8821cs.ko) must come from the same compiler and tree.
# The RG DS uses Android clang r487747c, the toolchain of the stock kernel.
TOOLCHAIN="clang"

# "dtb-basename:variant" pairs, one boot image each (out/boot_<variant>.img).
#   rk3566-anbernic-rg-ds.dts     stock clocks: CPU 1992 MHz, GPU 800 MHz
#   rk3566-anbernic-rg-ds-oc.dts  overclock: CPU 2160 MHz per bin + undervolt
DTBS="rk3566-anbernic-rg-ds:noc rk3566-anbernic-rg-ds-oc:oc"
