# boot-header.conf - Android boot image header parameters for the Anbernic RG DS, as
# shipped by the GammaOS boot image this ramdisk was taken from. Read by
# rgds/build-boot-images.sh; the kernel, device tree and RSCE are always built
# from this tree, only these header fields and rgds/ramdisk.cpio.gz are reused.
HDRV=2
OSVER=14.0.0
OSPATCH=2025-06
PAGESZ=0x00000800
BASE=0x00000000
KOFF=0x10008000
ROFF=0x11000000
SOFF=0x10f00000
TOFF=0x10000100
DOFF=0x0000000011f00000
CMDLINE='loglevel=0 quiet firmware_class.path=/vendor/etc/firmware init=/init rootwait ro loop.max_part=7 androidboot.hardware=rk30board androidboot.boot_devices=fe310000.sdhci,fe330000.nandc androidboot.selinux=permissive androidboot.wificountrycode=CN'
